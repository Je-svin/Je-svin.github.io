<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jesvin Jose - Portfolio</title>

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for in-browser JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --bg: #080b14;
      --surface: #101522;
      --surface2: #151b2b;
      --text: #f5f7ff;
      --muted: #9ba5bb;
      --accent: #8b7cff;
      --accent2: #4dd7ff;
      --line: rgba(255,255,255,.09);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 80% 5%, rgba(139,124,255,.13), transparent 25rem),
        radial-gradient(circle at 5% 45%, rgba(77,215,255,.06), transparent 25rem),
        var(--bg);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      line-height: 1.65;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }
    ::selection { background: var(--accent); color: white; }

    .navbar {
      position: fixed; z-index: 100; top: 0; left: 50%; transform: translateX(-50%);
      width: min(1180px, calc(100% - 32px)); margin-top: 16px;
      padding: 12px 16px 12px 20px; border: 1px solid var(--line);
      border-radius: 18px; background: rgba(8,11,20,.78); backdrop-filter: blur(20px);
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo { font: 700 21px "Space Grotesk"; letter-spacing: -.5px; }
    .logo span:first-child { color: var(--accent); }
    .dot { color: var(--accent2); }
    .nav-links { display: flex; gap: 4px; }
    .nav-links a { padding: 9px 10px; color: var(--muted); font-size: 13px; transition: .25s; }
    .nav-links a:hover { color: white; }
    .menu-btn { display: none; background: none; border: 0; color: white; cursor: pointer; }

    .section {
      width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 110px 0;
      position: relative;
    }
    .hero {
      min-height: 100vh; padding-top: 150px; display: grid;
      grid-template-columns: 1.1fr .9fr; align-items: center; gap: 70px;
    }
    .eyebrow {
      display: flex; align-items: center; gap: 8px; color: var(--accent2);
      text-transform: uppercase; letter-spacing: 2px; font-size: 11px; font-weight: 700;
    }
    .hero h1 {
      margin: 12px 0 12px; font: 700 clamp(45px, 7vw, 78px)/1.02 "Space Grotesk";
      letter-spacing: -4px;
    }
    .hero h1 span { display: block; background: linear-gradient(100deg, #fff, var(--accent2)); -webkit-background-clip: text; color: transparent; }
    .role-wrap { min-height: 48px; margin: 20px 0; overflow: hidden; }
    .role-line {
      display: inline-block; color: var(--accent); font: 600 clamp(20px, 3vw, 30px) "Space Grotesk";
      animation: roleIn .55s ease both;
    }
    @keyframes roleIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .hero-text { max-width: 620px; color: var(--muted); font-size: 17px; }
    .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 18px;
      font-weight: 700; font-size: 14px; transition: .25s; cursor: pointer;
    }
    .btn:hover { transform: translateY(-3px); }
    .btn.primary { background: linear-gradient(110deg, var(--accent), #6555f4); border: 0; color: white; }
    .btn.secondary { background: rgba(255,255,255,.04); }
    .quick-contact { display: flex; flex-wrap: wrap; gap: 18px; }
    .quick-contact a { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
    .quick-contact a:hover { color: white; }

    .hero-photo { position: relative; min-height: 550px; display: grid; place-items: center; }
    .photo-frame {
      width: min(390px, 80vw); aspect-ratio: 1; border-radius: 38% 62% 55% 45% / 45% 45% 55% 55%;
      padding: 8px; background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 0 90px rgba(139,124,255,.2); animation: morph 8s ease-in-out infinite;
      position: relative; z-index: 2;
    }
    @keyframes morph { 50% { border-radius: 55% 45% 40% 60% / 50% 55% 45% 50%; transform: translateY(-8px); } }
    .photo-frame img, .photo-placeholder {
      width: 100%; height: 100%; object-fit: cover; border-radius: inherit;
      background: #0d1220; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .initials { font: 700 80px "Space Grotesk"; color: rgba(255,255,255,.12); }
    .photo-placeholder p { margin: 10px 0 0 0; color: white; }
    .photo-placeholder small { color: var(--muted); }
    .photo-upload {
      position: absolute; bottom: 55px; z-index: 5; padding: 9px 14px; border: 1px solid var(--line);
      background: rgba(8,11,20,.8); border-radius: 10px; font-size: 12px; cursor: pointer; color: white;
    }
    .photo-upload input { display: none; }
    .orbit { position: absolute; border: 1px solid rgba(139,124,255,.25); border-radius: 50%; }
    .orbit-one { width: 520px; height: 520px; animation: spin 20s linear infinite; }
    .orbit-two { width: 600px; height: 380px; transform: rotate(35deg); animation: spin 26s linear reverse infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .floating-card {
      position: absolute; right: 0; bottom: 105px; z-index: 6; display: flex; gap: 10px; align-items: center;
      padding: 12px 14px; border: 1px solid var(--line); background: rgba(15,20,34,.9);
      border-radius: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.3);
    }
    .floating-card svg { color: #64e7a0; }
    .floating-card strong, .floating-card small { display: block; font-size: 11px; }
    .floating-card small { color: var(--muted); }

    .section-title { max-width: 720px; margin-bottom: 45px; }
    .section-title h2 { margin: 8px 0; font: 700 clamp(34px, 5vw, 52px)/1.1 "Space Grotesk"; letter-spacing: -2px; }
    .section-title > p:last-child { color: var(--muted); max-width: 600px; }

    .glass { background: linear-gradient(145deg, rgba(255,255,255,.055), rgba(255,255,255,.018)); border: 1px solid var(--line); backdrop-filter: blur(12px); }
    .about-grid { display: grid; grid-template-columns: 1.3fr .7fr; gap: 22px; }
    .about-card { padding: 32px; border-radius: var(--radius); color: var(--muted); }
    .about-card strong { color: white; }
    .highlights { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .highlight { padding: 22px; border-radius: 18px; transition: .25s; }
    .highlight:hover, .skill-card:hover, .project-card:hover, .cert-card:hover { transform: translateY(-6px); border-color: rgba(139,124,255,.35); }
    .highlight svg { color: var(--accent); margin-bottom: 18px; display: block; }
    .highlight strong, .highlight span { display: block; }
    .highlight span { color: var(--muted); font-size: 13px; }

    .timeline { position: relative; max-width: 850px; }
    .timeline:before { content: ""; position: absolute; left: 22px; top: 10px; bottom: 10px; width: 1px; background: var(--line); }
    .timeline-item { position: relative; display: grid; grid-template-columns: 46px 1fr; gap: 20px; margin-bottom: 22px; }
    .timeline-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: var(--surface2); border: 1px solid var(--line); color: var(--accent); z-index: 1; }
    .timeline-card { padding: 27px; border-radius: 18px; }
    .date { color: var(--accent2); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
    .timeline-card h3, .experience-card h3 { margin: 8px 0 3px; font: 600 22px "Space Grotesk"; }
    .institution { color: white !important; font-weight: 600; }
    .timeline-card p { color: var(--muted); margin: 5px 0; }
    .result { margin-top: 18px; display: inline-block; padding: 7px 11px; border-radius: 8px; background: rgba(139,124,255,.1); color: var(--muted); font-size: 13px; }
    .result strong { color: white; margin-left: 5px; }

    .skills-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .skill-card { min-height: 160px; padding: 20px; border-radius: 18px; position: relative; overflow: hidden; transition: .3s; }
    .skill-card svg { color: var(--accent); margin-top: 30px; }
    .skill-card h3 { margin: 9px 0 0; font: 600 18px "Space Grotesk"; }
    .skill-card p { color: var(--muted); font-size: 12px; margin: 0; }
    .skill-number { position: absolute; right: 16px; top: 14px; color: rgba(255,255,255,.18); font-size: 12px; }

    .projects-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .project-card { padding: 25px; border-radius: 20px; transition: .3s; display: flex; flex-direction: column; min-height: 370px; }
    .project-top { display: flex; justify-content: space-between; align-items: center; color: var(--accent); }
    .project-top span { font: 700 14px "Space Grotesk"; }
    .project-card h3 { font: 600 24px "Space Grotesk"; margin: 40px 0 10px; }
    .project-card p { color: var(--muted); font-size: 14px; }
    .tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 15px 0; }
    .tags span { border: 1px solid var(--line); border-radius: 99px; padding: 5px 9px; font-size: 11px; color: var(--muted); }
    .project-links { display: flex; gap: 18px; margin-top: auto; padding-top: 20px; }
    .project-links a, .cert-card a { display: flex; align-items: center; gap: 5px; color: white; font-size: 13px; font-weight: 700; }

    .experience-stack { max-width: 850px; display: grid; gap: 18px; }
    .experience-card { display: grid; grid-template-columns: 65px 1fr; gap: 20px; padding: 27px; border-radius: 20px; }
    .experience-badge { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(135deg, var(--accent), #5145d5); font-weight: 800; }
    .experience-card p, .experience-card li { color: var(--muted); }
    .experience-card ul { padding-left: 20px; margin-bottom: 0; }

    .cert-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .cert-card { position: relative; padding: 27px; border-radius: 20px; min-height: 260px; transition: .3s; }
    .cert-icon { color: #63e6a0; }
    .cert-index { position: absolute; top: 25px; right: 25px; color: rgba(255,255,255,.15); }
    .cert-card h3 { font: 600 21px "Space Grotesk"; margin: 30px 0 5px; }
    .cert-card strong { font-size: 13px; }
    .cert-card p { color: var(--muted); font-size: 13px; }
    .cert-card a { margin-top: 20px; }

    .contact-section { padding-bottom: 130px; }
    .contact-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: 20px; }
    .contact-info, .contact-form { border-radius: 20px; padding: 30px; }
    .contact-info h3 { font: 600 27px "Space Grotesk"; margin-top: 0; }
    .contact-info > p { color: var(--muted); }
    .contact-info > a { display: flex; align-items: center; gap: 10px; padding: 13px 0; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 14px; }
    .contact-info > a:hover { color: white; }
    .contact-info svg { width: 18px; color: var(--accent); }
    .contact-form { display: grid; gap: 17px; }
    .contact-form label { color: var(--muted); font-size: 12px; font-weight: 600; }
    .contact-form input, .contact-form textarea {
      display: block; width: 100%; margin-top: 7px; border: 1px solid var(--line);
      background: rgba(255,255,255,.035); color: white; border-radius: 10px; padding: 12px 14px;
      outline: none; resize: vertical;
    }
    .contact-form input:focus, .contact-form textarea:focus { border-color: var(--accent); }
    .form-note { color: #65e6a0; font-size: 12px; }

    footer {
      border-top: 1px solid var(--line); width: min(1120px, calc(100% - 40px)); margin: auto;
      padding: 30px 0; display: flex; justify-content: space-between; align-items: center; gap: 20px;
    }
    footer p { color: var(--muted); font-size: 12px; }
    .back-top { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; }

    .reveal { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    .hero-glow { position: absolute; border-radius: 50%; filter: blur(90px); pointer-events: none; }
    .glow-one { width: 180px; height: 180px; background: rgba(139,124,255,.18); top: 25%; right: 35%; }
    .glow-two { width: 150px; height: 150px; background: rgba(77,215,255,.1); bottom: 10%; left: 5%; }

    @media (max-width: 900px) {
      .nav-links { display: none; position: absolute; top: 62px; left: 0; right: 0; padding: 10px; flex-direction: column; background: rgba(8,11,20,.96); border: 1px solid var(--line); border-radius: 14px; }
      .nav-links.open { display: flex; }
      .menu-btn { display: block; }
      .hero { grid-template-columns: 1fr; text-align: center; gap: 20px; }
      .hero-copy { display: flex; flex-direction: column; align-items: center; }
      .hero-photo { min-height: 500px; }
      .quick-contact { justify-content: center; }
      .about-grid, .contact-grid { grid-template-columns: 1fr; }
      .skills-grid { grid-template-columns: repeat(2, 1fr); }
      .projects-grid, .cert-grid { grid-template-columns: 1fr; }
      .project-card { min-height: 320px; }
    }

    @media (max-width: 560px) {
      .section { width: min(100% - 28px, 1120px); padding: 80px 0; }
      .navbar { width: calc(100% - 20px); }
      .hero h1 { letter-spacing: -2.5px; }
      .hero-photo { min-height: 390px; }
      .photo-frame { width: 290px; }
      .orbit-one { width: 340px; height: 340px; }
      .orbit-two { width: 380px; height: 260px; }
      .floating-card { right: -4px; bottom: 35px; }
      .highlights { grid-template-columns: 1fr 1fr; }
      .skills-grid { grid-template-columns: 1fr 1fr; }
      .skill-card { min-height: 140px; }
      .timeline-item { grid-template-columns: 35px 1fr; gap: 12px; }
      .timeline-icon { width: 35px; height: 35px; }
      .timeline:before { left: 17px; }
      .experience-card { grid-template-columns: 1fr; }
      footer { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons
    const Sparkles = ({ size = 16 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.28 1.28L3 12l5.8 1.9a2 2 0 0 1 1.28 1.28L12 21l1.9-5.8a2 2 0 0 1 1.28-1.28L21 12l-5.8-1.9a2 2 0 0 1-1.28-1.28Z"/></svg>;
    const ArrowDown = ({ size = 18 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>;
    const ArrowUpRight = ({ size = 18 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>;
    const ArrowUp = ({ size = 18 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 15-6-6-6 6"/></svg>;
    const Mail = ({ size = 16 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>;
    const Phone = ({ size = 16 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>;
    const CheckCircle2 = ({ size = 18 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>;
    const GraduationCap = ({ size = 22 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>;
    const Code2 = ({ size = 22 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m18 16 4-4-4-4M6 8l-4 4 4 4"/></svg>;
    const BriefcaseBusiness = ({ size = 22 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 12h.01M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M22 13a18.15 18.15 0 0 1-20 0M2 6h20v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2Z"/></svg>;
    const Github = ({ size = 22 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4M9 18c-4.51 2-5-2-7-2"/></svg>;
    const ExternalLink = ({ size = 15 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>;
    const Linkedin = ({ size = 18 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>;
    const Send = ({ size = 17 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>;
    const Menu = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>;
    const X = ({ size = 24 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>;

    const roles = [
      "BTech Computer Science Graduate",
      "Data Science Intern",
      "Aspiring Data Analyst"
    ];

    const projects = [
      {
        title: "Library Management System",
        description:
          "A Python-based Library Management System developed using Object-Oriented Programming concepts. It manages books and supports viewing, adding, removing and issuing books.",
        tech: ["Python", "OOP", "File Handling"],
        icon: "01"
      },
      {
        title: "Jarvis an AI Assistant",
        description:
          "A Python-based voice-controlled desktop assistant inspired by AI assistants like Alexa and Jarvis. It can understand voice commands, respond using Windows text-to-speech, search the web, retrieve information from Wikipedia, play YouTube videos, open applications, tell jokes, and perform basic system commands.",
        tech: ["Python","Speech Recognition","Text-to-Speech","PowerShell","APIs"],
        icon: "02"
      },
        
      {
        title: "Infopark Jobs Web Scraping",
        description:
          "A Python web scraping project that collects job-related information and organizes the extracted data for easier analysis.",
        tech: ["Python", "BeautifulSoup", "Requests", "Pandas"],
        icon: "03"
      },
      {
        title: "Smart Car Parking System",
        description:
          "A smart parking solution designed to improve parking management and provide an efficient way to monitor and manage parking spaces.",
        tech: ["Python"],
        icon: "04"
      }
    ];

    const skills = [
      ["C", "Programming"],
      ["Python", "Programming"],
      ["Manual Testing", "Testing"],
      ["API Testing", "Testing"],
      ["Web Scraping", "Web"],
      ["Github", "Tools"],
      ["VS Code", "Tools"]
    ];

    function Navbar() {
      const [open, setOpen] = useState(false);
      const links = ["Home", "About", "Education", "Skills", "Projects", "Experience", "Certificates", "Contact"];

      return (
        <header className="navbar">
          <a className="logo" href="#home" onClick={() => setOpen(false)}>
            <span>J</span> Jesvin<span className="dot">.</span>
          </a>
          <button className="menu-btn" onClick={() => setOpen(!open)} aria-label="Toggle menu">
            {open ? <X size={24} /> : <Menu size={24} />}
          </button>
          <nav className={open ? "nav-links open" : "nav-links"}>
            {links.map((link) => (
              <a key={link} href={`#${link.toLowerCase()}`} onClick={() => setOpen(false)}>
                {link}
              </a>
            ))}
          </nav>
        </header>
      );
    }

    function Hero() {
      const [role, setRole] = useState(0);
      const [photo, setPhoto] = useState(null);

      useEffect(() => {
        const timer = setInterval(() => setRole((r) => (r + 1) % roles.length), 2600);
        return () => clearInterval(timer);
      }, []);

      const handlePhoto = (event) => {
        const file = event.target.files?.[0];
        if (file) setPhoto(URL.createObjectURL(file));
      };

      return (
        <section id="home" className="hero section">
          <div className="hero-glow glow-one" />
          <div className="hero-glow glow-two" />
          <div className="hero-copy reveal">
            <p className="eyebrow"><Sparkles size={16} /> Welcome to my portfolio</p>
            <h1>Hi, I'm <span>Jesvin Jose</span></h1>
            <div className="role-wrap">
              <span className="role-line" key={roles[role]}>{roles[role]}</span>
            </div>
            <p className="hero-text">
              Passionate about Data Analytics, Artificial Intelligence, Machine Learning
              and building practical software solutions.
            </p>
            <div className="hero-actions">
              <a className="btn primary" href="#projects">View My Projects <ArrowDown size={18} /></a>
              <a className="btn secondary" href="#contact">Contact Me <ArrowUpRight size={18} /></a>
            </div>
            <div className="quick-contact">
              <a href="mailto:jesvinjose660@gmail.com"><Mail size={16} /> jesvinjose660@gmail.com</a>
              <a href="tel:8714731168"><Phone size={16} /> 8714731168</a>
            </div>
          </div>

          <div className="hero-photo reveal">
            <div className="orbit orbit-one" />
            <div className="orbit orbit-two" />
            <div className="photo-frame">
              {photo ? (
                <img src={photo} alt="Jesvin Jose" />
              ) : (
                <div className="photo-placeholder">
                  <div className="initials">JJ</div>
                  <p>Add your photo</p>
                  <small>Click the button below</small>
                </div>
              )}
            </div>
            <label className="photo-upload">
              <input type="file" accept="image/*" onChange={handlePhoto} />
              {photo ? "Change Photo" : "Upload Photo"}
            </label>
            <div className="floating-card">
              <CheckCircle2 size={18} />
              <div><strong>Open to opportunities</strong><small>Data • AI • Software</small></div>
            </div>
          </div>
        </section>
      );
    }

    function SectionTitle({ kicker, title, text }) {
      return (
        <div className="section-title reveal">
          <p className="eyebrow">{kicker}</p>
          <h2>{title}</h2>
          {text && <p>{text}</p>}
        </div>
      );
    }

    function About() {
      return (
        <section id="about" className="section">
          <SectionTitle kicker="01 — About Me" title="Turning curiosity into practical skills." />
          <div className="about-grid">
            <div className="about-card glass reveal">
              <p>
                I am a BTech Computer Science graduate with a strong interest in Data
                Analytics, Artificial Intelligence, and Machine Learning. I enjoy learning
                new technologies and developing practical projects that solve real-world problems.
              </p>
              <p>
                I am currently pursuing a Data Science course at <strong>SMEC Technologies</strong>,
                where I am developing my skills in Python, data analysis, machine learning,
                and related technologies.
              </p>
              <p>
                I am also interested in software testing, API testing, web scraping,
                and developing efficient software solutions.
              </p>
            </div>
            <div className="highlights reveal">
              {[
                ["BTech CSE", "Graduate", GraduationCap],
                ["Data Science", "Learner", Sparkles],
                ["Python", "Enthusiast", Code2],
                ["Projects", "Builder", BriefcaseBusiness]
              ].map(([a, b, Icon]) => (
                <div className="highlight glass" key={a}>
                  <Icon size={22} />
                  <strong>{a}</strong><span>{b}</span>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Education() {
      return (
        <section id="education" className="section">
          <SectionTitle kicker="02 — Education" title="My academic journey." />
          <div className="timeline">
            <article className="timeline-item reveal">
              <div className="timeline-icon"><GraduationCap size={22} /></div>
              <div className="timeline-card glass">
                <span className="date">2022 — 2026</span>
                <h3>BTech — Computer Science and Engineering</h3>
                <p className="institution">Sahrdaya College of Engineering and Technology, Kodakara</p>
                <p>APJ Abdul Kalam Technological University (KTU)</p>
                <div className="result">CGPA <strong>7.92</strong></div>
              </div>
            </article>
            <article className="timeline-item reveal">
              <div className="timeline-icon"><GraduationCap size={22} /></div>
              <div className="timeline-card glass">
                <span className="date">2020 — 2022</span>
                <h3>Higher Secondary</h3>
                <p className="institution">St. Antony's HSS, Mala</p>
                <p>Kerala State Board</p>
                <div className="result">Percentage <strong>92%</strong></div>
              </div>
            </article>
          </div>
        </section>
      );
    }

    function Skills() {
      return (
        <section id="skills" className="section">
          <SectionTitle kicker="03 — Skills" title="Tools I work with." text="A growing technical toolkit built through coursework, projects and hands-on practice." />
          <div className="skills-grid">
            {skills.map(([name, category], i) => (
              <div className="skill-card glass reveal" key={name}>
                <span className="skill-number">0{i + 1}</span>
                <Code2 size={25} />
                <h3>{name}</h3>
                <p>{category}</p>
              </div>
            ))}
          </div>
        </section>
      );
    }

    function Projects() {
      return (
        <section id="projects" className="section">
          <SectionTitle kicker="04 — Projects" title="Things I've built." text="Projects that demonstrate my interest in Python, automation, web data and practical problem solving." />
          <div className="projects-grid">
            {projects.map((project) => (
              <article className="project-card glass reveal" key={project.title}>
                <div className="project-top">
                  <span>{project.icon}</span>
                  <Github size={22} />
                </div>
                <h3>{project.title}</h3>
                <p>{project.description}</p>
                {project.tech.length > 0 && (
                  <div className="tags">{project.tech.map((t) => <span key={t}>{t}</span>)}</div>
                )}
                <div className="project-links">
                  <a href="#contact">GitHub <ArrowUpRight size={15} /></a>
                  <a href="#contact">Demo <ExternalLink size={15} /></a>
                </div>
              </article>
            ))}
          </div>
        </section>
      );
    }

    function Experience() {
      return (
        <section id="experience" className="section">
          <SectionTitle kicker="05 — Experience" title="Experience & learning." />
          <div className="experience-stack">
            <article className="experience-card glass reveal">
              <div className="experience-badge">DS</div>
              <div>
                <span className="date">June 2026 — Present</span>
                <h3>Data Science Intern</h3>
                <p className="institution">SMEC Technologies</p>
                <p>Building practical knowledge in Python, data analysis, machine learning and data science workflows.</p>
              </div>
            </article>
            <article className="experience-card glass reveal">
              <div className="experience-badge">QA</div>
              <div>
                <span className="date">Internship</span>
                <h3>Quality Analyst Intern</h3>
                <p className="institution">Caddayn Biller Solutions</p>
                <ul>
                  <li>Manual and software testing</li>
                  <li>Regression testing and test case execution</li>
                  <li>API testing and bug identification/reporting</li>
                  <li>Automation testing using Python</li>
                </ul>
              </div>
            </article>
          </div>
        </section>
      );
    }

    function Certificates() {
      const certs = [
        ["AI for Future Workforce Program", "Intel & Dell Technologies", "AI awareness and foundation course"],
        ["The Joy of Computing Using Python", "NPTEL", "12 Week Course"],
        ["C Programming Bootcamp", "Udemy", "C Programming"]
      ];
      return (
        <section id="certificates" className="section">
          <SectionTitle kicker="06 — Certifications" title="Learning beyond the classroom." />
          <div className="cert-grid">
            {certs.map(([title, issuer, desc], i) => (
              <article className="cert-card glass reveal" key={title}>
                <div className="cert-icon"><CheckCircle2 size={24} /></div>
                <span className="cert-index">0{i + 1}</span>
                <h3>{title}</h3>
                <strong>{issuer}</strong>
                <p>{desc}</p>
                <a href="#contact">View Certificate <ArrowUpRight size={15} /></a>
              </article>
            ))}
          </div>
        </section>
      );
    }

    function Contact() {
      const [sent, setSent] = useState(false);
      const submit = (e) => {
        e.preventDefault();
        setSent(true);
        e.currentTarget.reset();
      };
      return (
        <section id="contact" className="section contact-section">
          <SectionTitle kicker="07 — Contact" title="Let's connect." text="Interested in technology, data, AI and software development? Feel free to reach out." />
          <div className="contact-grid">
            <div className="contact-info glass reveal">
              <h3>Have an opportunity?</h3>
              <p>I’m open to conversations about internships, entry-level opportunities and interesting projects.</p>
              <a href="tel:8714731168"><Phone /> 8714731168</a>
              <a href="mailto:jesvinjose660@gmail.com"><Mail /> jesvinjose660@gmail.com</a>
              <a href="https://www.linkedin.com/in/jesvin-jose-488b42254add" target="_blank" rel="noreferrer"><Linkedin /> LinkedIn Profile</a>
              <a href="https://github.com/" target="_blank" rel="noreferrer"><Github /> GitHub Profile</a>
            </div>
            <form className="contact-form glass reveal" onSubmit={submit}>
              <label>Name<input required name="name" placeholder="Your name" /></label>
              <label>Email<input required type="email" name="email" placeholder="you@example.com" /></label>
              <label>Message<textarea required name="message" rows="5" placeholder="Write your message..."></textarea></label>
              <button className="btn primary" type="submit"><Send size={17} /> {sent ? "Message Ready" : "Send Message"}</button>
              {sent && <p className="form-note">Form submitted locally. Connect it to an email service to receive messages.</p>}
            </form>
          </div>
        </section>
      );
    }

    function App() {
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => entries.forEach((entry) => entry.isIntersecting && entry.target.classList.add("visible")),
          { threshold: 0.12 }
        );
        document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));
        return () => observer.disconnect();
      }, []);

      return (
        <React.Fragment>
          <Navbar />
          <main>
            <Hero />
            <About />
            <Education />
            <Skills />
            <Projects />
            <Experience />
            <Certificates />
            <Contact />
          </main>
          <footer>
            <a className="logo" href="#home"><span>J</span> Jesvin<span className="dot">.</span></a>
            <p>© 2026 Jesvin Jose. All Rights Reserved.</p>
            <a href="#home" className="back-top" aria-label="Back to top"><ArrowUp size={18} /></a>
          </footer>
        </React.Fragment>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
